<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panda AI锐评局：针对具体测试、证据或分数路径提交评测申诉。">
  <title>Panda AI锐评局 · 提交评测申诉</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/appeal.css">
</head>
<body>
  <main>
    <a class="brand compact-brand" href="/" aria-label="Panda AI锐评局首页">
      <picture class="brand-logo">
        <source media="(max-width: 700px)" srcset="/assets/pandaai-mark.svg">
        <img src="/assets/pandaai-logo.svg" alt="" aria-hidden="true">
      </picture>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-copy"><b>锐评局</b><small>FINANCE AGENT VERDICT</small></span>
    </a>
    <a class="appeal-back" href="/">← 返回评测台</a>
    <header>
      <small>PARTICIPANT / APPEND-ONLY APPEAL</small>
      <h1>只纠错，<br>不改历史。</h1>
      <p class="deck">针对一条具体测试、证据或分数路径提交申诉。确认的平台故障最多获得一次同配置替代运行；Agent 或 Replica Skill 的失败不会触发替代。原始锁定结果始终保留。</p>
    </header>
    <form id="appeal-form" class="appeal-form">
      <label><span>评测 ID</span><input id="evaluation-id" required></label>
      <label><span>具体目标</span>
        <select id="target" required>
          <option value="">选择具体路径</option>
        </select>
      </label>
      <label><span>申诉理由</span><select id="grounds"><option value="platform-error">平台错误</option><option value="evidence-missing">证据缺失</option><option value="rubric-misapplied">量表误用</option></select></label>
      <label><span>可见证据 ID（逗号分隔，可选）</span><input id="evidence-ids" placeholder="ev_…"></label>
      <label><span>说明</span><textarea id="statement" required placeholder="说明这条具体路径为何需要复核。"></textarea></label>
      <button type="submit">提交申诉</button>
      <p id="status" role="status"></p>
    </form>
    <section aria-labelledby="timeline-heading">
      <h2 id="timeline-heading">申诉时间线</h2>
      <button id="load-appeals" type="button">查看我的申诉</button>
      <div id="timeline"></div>
    </section>
  </main>
  <script type="module" src="/appeal.js"></script>
</body>
</html>
