<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="锐评局公开人工评审工作台">
  <title>锐评局 · 公开评审席</title>
  <link rel="stylesheet" href="/judge.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">锐</span><span><b>锐评局</b><small>HUMAN REVIEW DESK</small></span></a>
    <a class="back-link" href="/">返回研究终审台 ↗</a>
  </header>

  <main>
    <section class="intro">
      <div>
        <p class="kicker">CUSTODY / OPEN SEAT</p>
        <h1>不设门槛，<em>只看证据。</em></h1>
        <p>模型四席评审锁定后即进入公开人工复核；任何人都可以查看已脱敏的证据与模型意见，提交一次打分，或直接跳过并以模型中位数结算终审。</p>
      </div>
      <aside class="seal-card" id="replica-seal-notice">
        <span>SEALED ARENA</span>
        <b>复刻结果仍密封</b>
        <p>复刻身份和对战优势在双轨终审结算前保持密封；模型 Arena 密封评分后，复刻人工评审即可与绝对分复核并行开放。</p>
      </aside>
    </section>

    <section class="rules-strip" aria-label="评审规则">
      <span>模型先评</span><span>公开评审</span><span>一次提交即可结算</span><span>可随时跳过</span>
    </section>

    <section class="queue-panel" aria-label="待复核评测列表">
      <header class="column-head"><span>OPEN QUEUE</span><h2>等待人工复核</h2></header>
      <p id="queue-status" role="status" aria-live="polite">正在读取列表…</p>
      <div id="queue-list" class="queue-list"></div>
    </section>
  </main>
  <template id="queue-card-template">
    <article class="queue-card">
      <header>
        <div><small class="queue-card-id"></small><b class="queue-card-heading">评测详情</b></div>
        <a class="queue-card-view" target="_blank" rel="noopener">查看详情 ↗</a>
      </header>
      <p class="queue-card-track-label">TRACK / 绝对分</p>
      <div class="queue-card-dimensions"></div>
      <div class="review-dossier" data-role="absolute-dossier"></div>
      <div class="queue-card-actions">
        <button type="button" class="queue-card-toggle" data-action="toggle-score">展开打分</button>
        <button type="button" class="queue-card-skip" data-action="skip">跳过人工打分</button>
      </div>
      <form class="queue-card-form hidden" data-role="score-form">
        <div class="queue-card-leaves"></div>
        <p class="queue-card-error" role="alert"></p>
        <div class="queue-card-form-actions">
          <button type="submit">提交人工打分</button>
        </div>
      </form>
    </article>
  </template>
  <template id="queue-leaf-template">
    <fieldset class="leaf-form">
      <h3 class="leaf-name"></h3>
      <label>评分（0–100）<input type="number" min="0" max="100" required class="leaf-score"></label>
      <label>引用可见证据 ID（逗号分隔，可留空）<input type="text" class="leaf-evidence"></label>
      <label>评审理由<textarea required class="leaf-rationale"></textarea></label>
      <label>相对模型结论
        <select class="leaf-disposition">
          <option value="affirm">接受</option>
          <option value="modify" selected>调整</option>
          <option value="overturn">推翻</option>
        </select>
      </label>
      <label class="leaf-override-label hidden">推翻理由（推翻时必填）<textarea class="leaf-override"></textarea></label>
    </fieldset>
  </template>
  <template id="queue-replica-card-template">
    <article class="queue-card queue-card-replica">
      <header>
        <div><small class="queue-card-id"></small><b class="queue-card-heading">复刻人工评审</b></div>
        <a class="queue-card-view" target="_blank" rel="noopener">查看详情 ↗</a>
      </header>
      <p class="queue-card-track-label">TRACK / 复刻</p>
      <p class="queue-card-replica-hint">对提交 Agent 与每个有效复刻 Runtime 打四维分；来源标签均已匿名，不代表真实身份。请先填齐下方分数再提交；同题材料默认折叠。</p>
      <form class="queue-card-form" data-role="replica-score-form" novalidate>
        <div class="queue-card-leaves replica-source-list"></div>
        <label class="replica-rationale-label">简短说明（可选）<textarea class="replica-rationale"></textarea></label>
        <p class="queue-card-error" role="alert"></p>
        <div class="queue-card-form-actions">
          <button type="submit">提交复刻人工打分</button>
        </div>
      </form>
      <div class="review-dossier" data-role="replica-dossier"></div>
    </article>
  </template>
  <template id="queue-replica-source-template">
    <fieldset class="leaf-form replica-source-form">
      <h3 class="leaf-name"></h3>
      <label>任务约束遵循（0–100）<input type="number" min="0" max="100" required class="replica-dim" data-dim="taskConstraint"></label>
      <label>专业质量（0–100）<input type="number" min="0" max="100" required class="replica-dim" data-dim="professionalQuality"></label>
      <label>证据与风险（0–100）<input type="number" min="0" max="100" required class="replica-dim" data-dim="evidenceRisk"></label>
      <label>产物可用性（0–100）<input type="number" min="0" max="100" required class="replica-dim" data-dim="artifactUsability"></label>
    </fieldset>
  </template>
  <script type="module" src="/judge.js"></script>
</body>
</html>
