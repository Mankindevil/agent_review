server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
    }

    location / {
        return 503;
    }
}
