server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __PUBLIC_IP__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://__PUBLIC_IP__$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __PUBLIC_IP__;

    ssl_certificate /etc/letsencrypt/live/__PUBLIC_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 4m;

    # The public origin is deliberately an allowlist.  V2 records remain
    # addressable via the shared collection/detail endpoints, but V2-only
    # administration, appeals and evidence mutations never reach Node here.
    location = / {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /app.js {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /styles.css {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /a2a-ui-helpers.js {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /evaluation-actions.js {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /result-v2.js {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /rubric-labels.js {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /evaluation-version-ui.js {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /methodology.html {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /methodology.css {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /agent-check {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173/agent-check.html;
    }

    location = /agent-check.html {
        if ($request_method != GET) {
            return 405;
        }
        return 308 /agent-check;
    }

    location = /agent-check.js {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /agent-check-helpers.js {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /example-import.js {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /agent-check.css {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /favicon.svg {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /assets/pandaai-logo.svg {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /assets/pandaai-mark.svg {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /api/health {
        if ($request_method != GET) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /api/runtimes {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location = /api/data-source {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    # Kept shared so historical V2 records and direct clients can still
    # create, list and inspect records.  The homepage itself is V1-only.
    location = /api/evaluations {
        if ($request_method !~ "^(GET|POST)$") { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1260s;
        proxy_read_timeout 1260s;
    }

    location ~ ^/api/evaluations/[^/]+$ {
        if ($request_method !~ ^(GET|DELETE)$) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location ~ ^/api/evaluations/[^/]+/(?:events|report\.pdf)$ {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1260s;
        proxy_read_timeout 1260s;
    }

    location ~ ^/api/evaluations/[^/]+/builds/[^/]+/skill$ {
        if ($request_method != GET) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location ~ ^/api/evaluations/[^/]+/cancel$ {
        if ($request_method != POST) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
    }

    location ~ ^/api/evaluations/[^/]+/retry$ {
        if ($request_method != POST) { return 405; }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 7500s;
        proxy_read_timeout 7500s;
    }

    location = /api/agent-cards/resolve {
        if ($request_method != POST) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 40s;
        proxy_read_timeout 40s;
    }

    location = /api/agent-diagnostics {
        if ($request_method != POST) {
            return 405;
        }
        include proxy_params;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1260s;
        proxy_read_timeout 1260s;
    }

    location ~ ^/api/(?:admin|internal|appeals)(?:/|$) {
        return 404;
    }

    location ~ ^/api/evaluations/[^/]+/(?:appeals|evidence(?:-manifest)?)(?:/|$) {
        return 404;
    }

    location / {
        return 404;
    }
}
